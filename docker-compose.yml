services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # One-shot: pull the local models, then exit. The app no longer does this
  # itself - the previous version ran curl inside the app container, where
  # curl wasn't installed, and replaced the Streamlit CMD entirely.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull mistral && ollama pull llava"]
    restart: "no"

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DEBUG=False
    volumes:
      - ./user_data:/app/user_data
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
    driver: local
